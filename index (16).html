<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b3d3b">
<title>Indalur Youngster Fund</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+Tamil:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#08211f;
  --deep:#0b3d3b;
  --deep2:#12544f;
  --gold:#d9a62e;
  --gold-soft:#f0cf7a;
  --cream:#f5f1e6;
  --card:#ffffff;
  --line:#e2dccb;
  --muted:#7d7a6d;
  --ok:#1f7a4d;
  --warn:#b07d12;
  --bad:#b23b2e;
  --r:16px;
  --font:'Outfit','Noto Sans Tamil',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  /* subtle diamond pattern */
  background-image:
    repeating-linear-gradient(45deg, rgba(11,61,59,.035) 0 2px, transparent 2px 14px),
    repeating-linear-gradient(-45deg, rgba(217,166,46,.045) 0 2px, transparent 2px 14px);
}
.wrap{max-width:900px;margin:0 auto;padding:0 12px 70px;}

/* ---------- HERO ---------- */
.hero{
  position:relative;margin:0 -12px;padding:26px 18px 30px;overflow:hidden;
  border-radius:0 0 26px 26px;
}
.hero .bgimg{
  position:absolute;inset:-25px;
  background-image:var(--photo);
  background-size:cover;background-position:center 28%;
  filter:blur(9px) saturate(.75) brightness(.55);
  transform:scale(1.12);
}
.hero .veil{
  position:absolute;inset:0;
  background:linear-gradient(160deg, rgba(11,61,59,.88) 0%, rgba(8,33,31,.92) 100%);
}
.hero .inner{position:relative;z-index:2;color:#fff;}
.crest{
  width:46px;height:46px;border-radius:12px;
  background:linear-gradient(140deg,var(--gold),var(--gold-soft));
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1.1rem;color:var(--deep);margin-bottom:10px;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
}
.hero h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.3px;line-height:1.2;}
.hero .tag{font-size:.82rem;opacity:.82;margin-top:4px;font-weight:300;letter-spacing:.3px;}
.goldline{height:3px;width:52px;background:var(--gold);border-radius:2px;margin-top:12px;}
.langbtn{
  position:absolute;top:0;right:0;z-index:3;
  background:rgba(255,255,255,.14);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.28);color:#fff;
  border-radius:22px;padding:7px 14px;font-size:.76rem;font-weight:600;cursor:pointer;font-family:var(--font);
}
.syncdot{position:absolute;top:44px;right:0;z-index:3;font-size:.66rem;color:#fff;opacity:.7;}

/* ---------- STATS ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-18px;position:relative;z-index:5;}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 12px;box-shadow:0 3px 14px rgba(11,61,59,.07);
}
.stat .num{font-size:1.25rem;font-weight:800;color:var(--deep);letter-spacing:-.4px;}
.stat .lbl{font-size:.68rem;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
.stat.accent .num{color:var(--gold);}

/* ---------- TABS ---------- */
nav.tabs{display:flex;overflow-x:auto;gap:7px;margin:16px 0 6px;padding-bottom:5px;scrollbar-width:none;}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{
  flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--deep);
  padding:8px 15px;border-radius:22px;font-size:.8rem;font-weight:600;cursor:pointer;
  white-space:nowrap;font-family:var(--font);
}
nav.tabs button.active{background:var(--deep);color:#fff;border-color:var(--deep);}

/* ---------- CARDS ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(11,61,59,.05);
}
.card h2{
  font-size:.78rem;margin:0 0 14px;text-transform:uppercase;letter-spacing:1px;
  color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px;
}
.card h2::before{content:'';width:14px;height:2px;background:var(--gold);border-radius:2px;}
.section{display:none;} .section.active{display:block;}

label{display:block;font-size:.74rem;color:var(--muted);margin:12px 0 5px;font-weight:600;letter-spacing:.3px;}
input,select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;
  background:#fdfcf8;color:var(--ink);font-size:.92rem;font-family:var(--font);
}
input:focus,select:focus{outline:none;border-color:var(--gold);background:#fff;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--deep);color:#fff;border:none;padding:12px 18px;border-radius:12px;
  font-size:.87rem;font-weight:700;cursor:pointer;margin-top:14px;font-family:var(--font);
}
.btn:active{transform:scale(.98);}
.btn.gold{background:var(--gold);color:var(--ink);}
.btn.ghost{background:transparent;color:var(--deep);border:1.5px solid var(--deep);}
.btn.sm{padding:7px 12px;font-size:.74rem;margin-top:0;border-radius:9px;}
.btn.ok{background:var(--ok);}
.btn.wa{background:#1f9d55;}
.btn.bad{background:var(--bad);}
.btn.full{width:100%;}
.rowf{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}

table{width:100%;border-collapse:collapse;font-size:.85rem;}
th{font-size:.66rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;text-align:left;padding:6px 5px;border-bottom:1.5px solid var(--line);}
td{padding:9px 5px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.68rem;font-weight:700;letter-spacing:.3px;}
.b-active{background:#fdf3d9;color:var(--warn);}
.b-overdue{background:#fbe4e1;color:var(--bad);}
.b-repaid{background:#ddf0e4;color:var(--ok);}
.b-exc{background:#ddf0e4;color:var(--ok);}
.b-good{background:#e0ecfb;color:#1d5fa8;}
.b-fair{background:#fdf3d9;color:var(--warn);}
.b-poor{background:#fbe4e1;color:var(--bad);}
.b-new{background:#eeeade;color:var(--muted);}

.sigbox{border:1.5px dashed var(--line);border-radius:12px;background:#fff;height:120px;width:100%;touch-action:none;display:block;}
.sigrow{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap;}
.filelbl{display:inline-flex;align-items:center;gap:5px;background:transparent;color:var(--deep);border:1.5px solid var(--deep);padding:7px 12px;border-radius:9px;font-size:.74rem;font-weight:700;cursor:pointer;margin:0;}

.loanCard{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:12px;margin-bottom:11px;background:#fdfcf8;}
.loanCard .hr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.loanCard .amt{font-weight:800;font-size:1.1rem;color:var(--deep);}
.muted{color:var(--muted);font-size:.78rem;line-height:1.5;}
.empty{text-align:center;color:var(--muted);padding:22px 0;font-size:.85rem;}

.qitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.qitem:last-child{border-bottom:none;}
.rank{width:28px;height:28px;border-radius:9px;background:var(--deep);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78rem;flex:0 0 auto;}

/* ---------- LOCK ---------- */
.lock{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:22px;overflow:hidden;}
.lock .lbg{position:absolute;inset:-25px;background-image:var(--photo);background-size:cover;background-position:center;filter:blur(14px) brightness(.4);transform:scale(1.15);}
.lock .lveil{position:absolute;inset:0;background:linear-gradient(160deg,rgba(11,61,59,.9),rgba(8,33,31,.95));}
.lock .lc{position:relative;z-index:2;width:100%;max-width:330px;background:var(--card);border-radius:20px;padding:26px 20px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4);}
.lock input{text-align:center;letter-spacing:8px;font-size:1.3rem;font-weight:700;}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:.82rem;font-weight:600;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.setupWarn{background:#fdf3d9;border:1px solid var(--gold);color:#6b5210;padding:11px 13px;border-radius:12px;font-size:.78rem;line-height:1.5;margin:12px 0;}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- ============ LOCK ============ -->
<div class="lock" id="lockScreen" style="display:none;">
  <div class="lbg"></div><div class="lveil"></div>
  <div class="lc">
    <div class="crest" style="margin:0 auto 12px;">IYF</div>
    <h3 style="margin:0 0 4px;font-size:1.05rem;">Indalur Youngster Fund</h3>
    <p class="muted" id="lockSub" style="margin:0 0 16px;"></p>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••">
    <button class="btn gold full" id="pinBtn"></button>
    <p id="lockMsg" style="color:var(--bad);font-size:.78rem;min-height:18px;margin:8px 0 0;"></p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" style="display:none;">
<div class="wrap">

  <header class="hero">
    <div class="bgimg"></div><div class="veil"></div>
    <div class="inner">
      <button class="langbtn" id="langToggle">தமிழ் / EN</button>
      <div class="syncdot" id="syncDot"></div>
      <div class="crest">IYF</div>
      <h1>இந்தளூர் Youngster Fund</h1>
      <div class="tag" id="appTag"></div>
      <div class="goldline"></div>
    </div>
  </header>

  <div id="setupWarnBox"></div>

  <div class="stat-grid">
    <div class="stat"><div class="num" id="sBal">₹0</div><div class="lbl" data-i="sBal"></div></div>
    <div class="stat"><div class="num" id="sOut">₹0</div><div class="lbl" data-i="sOut"></div></div>
    <div class="stat accent"><div class="num" id="sInt">₹0</div><div class="lbl" data-i="sInt"></div></div>
    <div class="stat"><div class="num" id="sMem">0</div><div class="lbl" data-i="sMem"></div></div>
  </div>

  <nav class="tabs">
    <button data-tab="dash" class="active" data-i="tDash"></button>
    <button data-tab="members" data-i="tMem"></button>
    <button data-tab="newloan" data-i="tNew"></button>
    <button data-tab="loans" data-i="tLoans"></button>
    <button data-tab="queue" data-i="tQueue"></button>
    <button data-tab="trust" data-i="tTrust"></button>
  </nav>

  <!-- DASH -->
  <section class="section active" id="tab-dash">
    <div class="card">
      <h2 data-i="hContrib"></h2>
      <label data-i="lContrib"></label>
      <input type="number" id="contribAmt" placeholder="2500">
      <button class="btn gold" id="btnContrib" data-i="bContrib"></button>
      <p class="muted" id="contribHint" style="margin-top:10px;"></p>
    </div>
    <div class="card">
      <h2 data-i="hRecent"></h2>
      <div id="recentBox"></div>
    </div>
  </section>

  <!-- MEMBERS -->
  <section class="section" id="tab-members">
    <div class="card">
      <h2 data-i="hAddMem"></h2>
      <label data-i="lName"></label><input type="text" id="memName">
      <label data-i="lPhone"></label><input type="tel" id="memPhone" placeholder="9XXXXXXXXX">
      <button class="btn" id="btnAddMem" data-i="bAddMem"></button>
    </div>
    <div class="card">
      <h2 data-i="hMemList"></h2>
      <table><thead><tr><th data-i="thName"></th><th data-i="thPhone"></th><th></th></tr></thead>
      <tbody id="memBody"></tbody></table>
      <div class="empty" id="memEmpty" style="display:none;"></div>
    </div>
  </section>

  <!-- NEW LOAN -->
  <section class="section" id="tab-newloan">
    <div class="card">
      <h2 data-i="hNewLoan"></h2>
      <label data-i="lBorrower"></label><select id="loanMember"></select>
      <label data-i="lAmount"></label><input type="number" id="loanAmount" placeholder="5000">
      <p class="muted" id="loanCalc" style="margin:7px 0 0;"></p>
      <label data-i="lDate"></label><input type="date" id="loanDate">
      <label data-i="lNominee"></label><input type="text" id="nomineeName">

      <label data-i="lSigB"></label>
      <canvas class="sigbox" id="sigB"></canvas>
      <div class="sigrow">
        <button class="btn ghost sm" data-clear="sigB" data-i="bClear"></button>
        <label class="filelbl"><span data-i="bCamera"></span><input type="file" accept="image/*" capture="environment" style="display:none;" data-up="sigB"></label>
        <label class="filelbl"><span data-i="bGallery"></span><input type="file" accept="image/*" style="display:none;" data-up="sigB"></label>
      </div>

      <label data-i="lSigN"></label>
      <canvas class="sigbox" id="sigN"></canvas>
      <div class="sigrow">
        <button class="btn ghost sm" data-clear="sigN" data-i="bClear"></button>
        <label class="filelbl"><span data-i="bCamera"></span><input type="file" accept="image/*" capture="environment" style="display:none;" data-up="sigN"></label>
        <label class="filelbl"><span data-i="bGallery"></span><input type="file" accept="image/*" style="display:none;" data-up="sigN"></label>
      </div>

      <label data-i="lSigR"></label>
      <canvas class="sigbox" id="sigR"></canvas>
      <div class="sigrow">
        <button class="btn ghost sm" data-clear="sigR" data-i="bClear"></button>
        <label class="filelbl"><span data-i="bCamera"></span><input type="file" accept="image/*" capture="environment" style="display:none;" data-up="sigR"></label>
        <label class="filelbl"><span data-i="bGallery"></span><input type="file" accept="image/*" style="display:none;" data-up="sigR"></label>
      </div>

      <button class="btn ok full" id="btnSaveLoan" data-i="bSaveLoan"></button>
      <p id="loanMsg" style="font-size:.8rem;min-height:18px;margin:8px 0 0;"></p>
    </div>
  </section>

  <!-- LOANS -->
  <section class="section" id="tab-loans">
    <div class="card">
      <h2 data-i="hLoans"></h2>
      <div id="loansBox"></div>
      <div class="empty" id="loansEmpty" style="display:none;"></div>
    </div>
  </section>

  <!-- QUEUE -->
  <section class="section" id="tab-queue">
    <div class="card">
      <h2 data-i="hQAdd"></h2>
      <label data-i="lBorrower"></label><select id="qMember"></select>
      <label data-i="lAmount"></label><input type="number" id="qAmount">
      <label data-i="lNote"></label><input type="text" id="qNote">
      <button class="btn" id="btnAddQ" data-i="bAddQ"></button>
    </div>
    <div class="card">
      <h2 data-i="hQList"></h2>
      <div id="qBox"></div>
      <div class="empty" id="qEmpty" style="display:none;"></div>
    </div>
  </section>

  <!-- TRUST -->
  <section class="section" id="tab-trust">
    <div class="card">
      <h2 data-i="hTrust"></h2>
      <table><thead><tr><th data-i="thName"></th><th data-i="thLoans"></th><th data-i="thOnTime"></th><th data-i="thScore"></th></tr></thead>
      <tbody id="trustBody"></tbody></table>
      <div class="empty" id="trustEmpty" style="display:none;"></div>
      <p class="muted" id="trustHint" style="margin-top:12px;"></p>
    </div>
  </section>

</div>
</div>

<div class="toast" id="toast"></div>

let lang = localStorage.getItem('iyf_lang') || 'ta';

/* ---------------- STATE ---------------- */
let DATA = { config:{pin:'', balance:50000, totalCollected:50000, interestEarned:0, rate:3, maxLoan:5000},
             members:[], loans:[], queue:[] };
const LS = 'iyf_data_v2';
const API_ON = SHEET_API && SHEET_API.indexOf('http') === 0;

function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(DATA)); }catch(e){} }
function loadLocal(){ try{ const r=localStorage.getItem(LS); if(r) DATA=JSON.parse(r); }catch(e){} }

async function apiGet(){
  if(!API_ON) return null;
  const res = await fetch(SHEET_API + '?action=load&_=' + Date.now());
  return await res.json();
}
async function apiSave(){
  saveLocal();
  if(!API_ON){ return; }
  setSync(t('syncing'));
  try{
    await fetch(SHEET_API, { method:'POST', body: JSON.stringify({action:'save', data:DATA}) });
    setSync('✓ ' + t('synced'));
  }catch(e){ setSync('⚠ ' + t('syncFail')); }
}
function setSync(msg){
  const el = document.getElementById('syncDot');
  el.textContent = msg;
  clearTimeout(el._tm);
  el._tm = setTimeout(()=>{ el.textContent=''; }, 3000);
}

/* ---------------- UTIL ---------------- */
const money = n => '₹' + (Number(n)||0).toLocaleString('en-IN');
const today = () => new Date().toISOString().slice(0,10);
function addMonth(d){ const x=new Date(d); x.setMonth(x.getMonth()+1); return x.toISOString().slice(0,10); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),2300); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------------- i18n apply ---------------- */
function applyI18n(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i')); });
  document.getElementById('appTag').textContent = t('appTag');
  document.getElementById('contribHint').textContent = t('contribHint');
  document.getElementById('trustHint').textContent = t('trustHint');
  const wb = document.getElementById('setupWarnBox');
  wb.innerHTML = API_ON ? '' : `<div class="setupWarn">${t('setupWarn')}</div>`;
}

/* ---------------- RENDER ---------------- */
function loanStatus(l){
  if(l.status==='repaid') return {c:'b-repaid', x:t('stRepaid')};
  if(l.dueDate < today()) return {c:'b-overdue', x:t('stOverdue')};

function trustOf(id){
  const ml = DATA.loans.filter(l=>l.memberId===id);
  if(!ml.length) return {pct:null,total:0,onTime:0};
  const onTime = ml.filter(l=>l.status==='repaid' && l.repaidDate && l.repaidDate<=l.dueDate).length;
  return {pct:Math.round(onTime/ml.length*100), total:ml.length, onTime};
}
function badgeOf(p){
  if(p===null) return {c:'b-new', x:t('newm')};
  if(p>=90) return {c:'b-exc', x:t('excellent')};
  if(p>=70) return {c:'b-good', x:t('good')};
  if(p>=50) return {c:'b-fair', x:t('fair')};
  return {c:'b-poor', x:t('poor')};
}
function renderTrust(){
  const b=document.getElementById('trustBody'), e=document.getElementById('trustEmpty');
  if(!DATA.members.length){ b.innerHTML=''; e.style.display='block'; e.textContent=t('noMem'); return; }
  e.style.display='none';
  b.innerHTML = DATA.members.map(m=>({m, ...trustOf(m.id)}))
    .sort((a,b2)=> (b2.pct===null?-1:b2.pct) - (a.pct===null?-1:a.pct))
    .map(r=>{ const bg=badgeOf(r.pct);
      return `<tr><td><strong>${esc(r.m.name)}</strong></td><td>${r.total}</td><td>${r.onTime}</td>
      <td><span class="badge ${bg.c}">${r.pct===null?bg.x:r.pct+'%'}</span></td></tr>`; }).join('');
}

/* ---------------- SIGNATURE PADS ---------------- */
const sigCtx = {}; // id -> {ready:bool}
function initPad(id){
  const cv=document.getElementById(id);
  sigCtx[id] = { sized:false };
  let down=false,last=null;
  const P=e=>{ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:p.clientX-r.left,y:p.clientY-r.top}; };
  const S=e=>{ ensureSigSized(id); down=true;last=P(e);e.preventDefault();};
  const M=e=>{ if(!down)return; const p=P(e),x=cv.getContext('2d');
    x.beginPath(); x.moveTo(last.x,last.y); x.lineTo(p.x,p.y); x.stroke(); last=p; e.preventDefault(); };
  const E=()=>down=false;
  cv.addEventListener('mousedown',S); cv.addEventListener('mousemove',M); window.addEventListener('mouseup',E);
  cv.addEventListener('touchstart',S,{passive:false}); cv.addEventListener('touchmove',M,{passive:false}); cv.addEventListener('touchend',E);
}
function ensureSigSized(id){
  const cv=document.getElementById(id);
  const r=cv.getBoundingClientRect();
  if(r.width<5 || r.height<5) return false; // still hidden, can't size yet
  if(sigCtx[id] && sigCtx[id].sized && cv.width>0) return true; // already sized, keep drawing intact
  const dp=window.devicePixelRatio||1;
  cv.width=r.width*dp; cv.height=r.height*dp;
  const x=cv.getContext('2d'); x.scale(dp,dp);
  x.lineWidth=2.2; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#08211f';
  sigCtx[id].sized = true;
  return true;
}
['sigB','sigN','sigR'].forEach(initPad);

document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{
  const c=document.getElementById(b.dataset.clear);
  c.getContext('2d').clearRect(0,0,c.width,c.height);
});
document.querySelectorAll('[data-up]').forEach(inp=>inp.onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const cv=document.getElementById(inp.dataset.up);
  ensureSigSized(inp.dataset.up);
  const rd=new FileReader();
  rd.onload=()=>{ const im=new Image(); im.onload=()=>{
    const x=cv.getContext('2d'), r=cv.getBoundingClientRect();
    x.clearRect(0,0,cv.width,cv.height);
    const sc=Math.min(r.width/im.width, r.height/im.height);
    x.drawImage(im,(r.width-im.width*sc)/2,(r.height-im.height*sc)/2,im.width*sc,im.height*sc);
  }; im.src=rd.result; };
  rd.readAsDataURL(f);
  e.target.value='';
});
function sigEmpty(id){
  ensureSigSized(id);
  const c=document.getElementById(id);
  if(c.width===0 || c.height===0) return true;
  const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
  for(let i=3;i<d.length;i+=4) if(d[i]!==0) return false;
  return true;
}
function sigPng(id){
  const src=document.getElementById(id);
  const o=document.createElement('canvas'); o.width=260; o.height=95;
  const x=o.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,260,95);
  x.drawImage(src,0,0,260,95);
  return o.toDataURL('image/jpeg',0.6);
}
function clearSigs(){ ['sigB','sigN','sigR'].forEach(id=>{ const c=document.getElementById(id); c.getContext('2d').clearRect(0,0,c.width,c.height); }); }

document.getElementById('btnSaveLoan').onclick = async ()=>{
  const msg=document.getElementById('loanMsg'); msg.style.color='var(--bad)';
  try{
  const m = DATA.members.find(x=>x.id===document.getElementById('loanMember').value);
  const a = Number(document.getElementById('loanAmount').value);
  const d = document.getElementById('loanDate').value;
  const nom = document.getElementById('nomineeName').value.trim();
  if(!m||!a||!d||!nom){ msg.textContent=t('eFill'); return; }
  if(a>DATA.config.maxLoan){ msg.textContent=t('eMax'); return; }
  if(DATA.loans.some(l=>l.memberId===m.id && l.status!=='repaid')){ msg.textContent=t('eActive'); return; }
  const interest=Math.round(a*DATA.config.rate/100), net=a-interest;
  if(net > DATA.config.balance){ msg.textContent=t('eBal'); return; }
  if(sigEmpty('sigB')||sigEmpty('sigN')||sigEmpty('sigR')){ msg.textContent=t('eSig'); return; }

  DATA.loans.push({
    id:uid(), memberId:m.id, memberName:m.name, phone:m.phone||'',
    principal:a, rate:DATA.config.rate, interestAmount:interest, netDisbursed:net,
    disbursedDate:d, dueDate:addMonth(d), nomineeName:nom,
    sigB:sigPng('sigB'), sigN:sigPng('sigN'), sigR:sigPng('sigR'),
    status:'active', repaidDate:'', createdAt:Date.now()
  });
  DATA.config.balance -= net;
  document.getElementById('loanAmount').value=''; document.getElementById('nomineeName').value='';
  clearSigs(); updCalc();
  renderAll();
  msg.style.color='var(--ok)'; msg.textContent=t('okLoan');
  }catch(err){ msg.style.color='var(--bad)'; msg.textContent='Error: '+(err&&err.message?err.message:err); return; }
  await apiSave(); toast(t('okLoan'));
};

document.getElementById('btnAddQ').onclick = async ()=>{
  const m=DATA.members.find(x=>x.id===document.getElementById('qMember').value);
  const a=Number(document.getElementById('qAmount').value);
  const n=document.getElementById('qNote').value.trim();
  if(!m||!a) return toast(t('eFill'));
  const mx = DATA.queue.length ? Math.max(...DATA.queue.map(q=>q.priority)) : 0;
  DATA.queue.push({id:uid(), memberId:m.id, memberName:m.name, phone:m.phone||'', amount:a, note:n, priority:mx+1});
  document.getElementById('qAmount').value=''; document.getElementById('qNote').value='';
  renderQueue(); await apiSave(); toast(t('okQ'));
};
window.moveQ = async (id,dir)=>{
  const q=[...DATA.queue].sort((a,b)=>a.priority-b.priority);
  const i=q.findIndex(x=>x.id===id), j=i+dir;
  if(j<0||j>=q.length) return;
  const tmp=q[i].priority; q[i].priority=q[j].priority; q[j].priority=tmp;
  renderQueue(); await apiSave();
};
window.delQ = async id=>{ DATA.queue=DATA.queue.filter(x=>x.id!==id); renderQueue(); await apiSave(); };
window.fromQueue = async id=>{
  const q=DATA.queue.find(x=>x.id===id); if(!q) return;
  document.querySelector('nav.tabs button[data-tab="newloan"]').click();
  document.getElementById('loanMember').value=q.memberId;
  document.getElementById('loanAmount').value=q.amount;
  updCalc();
  DATA.queue=DATA.queue.filter(x=>x.id!==id);
  renderQueue(); await apiSave();
};
